name: Test

# Runs the test suite on a runner with babashka + the Datalevin pod, so the
# core-semantics suite exercises BOTH store implementations (memory + datalevin).
# Complements publish-book.yml, which only builds the book.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project's own installer. USE_BREW=0 keeps CI on the pinned GitHub
      # downloads (the runner image ships Homebrew, which would otherwise win
      # and float to latest) — reproducible versions, and the fallback path
      # setup.sh's brew-less users take gets covered by every run.
      - name: Install babashka + the Datalevin pod (scripts/setup.sh)
        run: |
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          USE_BREW=0 INSTALL_DIR="$HOME/.local/bin" scripts/setup.sh

      - name: Run the test suite (memory + datalevin stores)
        run: bb test
